checks:
  # kube-linter's default check set. addAllBuiltIn pulled in every optional
  # check (owner labels, 3+ replicas, node affinity, network isolation, strict
  # schema validation that trips on the sops: block in *.enc.yaml, ...), which
  # target multi-team production clusters and produced ~300 findings of noise.
  addAllBuiltIn: false
  exclude:
    # Most workloads run upstream images (postgres, searxng, n8n, ...) that
    # write to their root filesystem.
    - "no-read-only-root-fs"
    # CPU requests/limits are left to the scheduler on this small cluster.
    - "unset-cpu-requirements"
    # Known debt, excluded so CI signals new problems instead of old ones.
    # Fixing these changes how live workloads run, so do it per app:
    #   run-as-non-root            - 17 workloads, mostly upstream root images
    #   latest-tag                 - miniflux, n8n, nut, searxng, homepage
    #   unset-memory-requirements  - hermes-agent, hermes-family, hindsight,
    #                                homepage, nut
    - "run-as-non-root"
    - "latest-tag"
    - "unset-memory-requirements"
