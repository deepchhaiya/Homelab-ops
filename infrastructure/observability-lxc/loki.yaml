auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /data/loki
  storage:
    filesystem:
      chunks_directory: /data/loki/chunks
      rules_directory: /data/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h        # 30 days
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  allow_structured_metadata: true
  retention_stream:
    - selector: '{job="opnsense_dns"}'
      priority: 10
      period: 2160h             # 90 days — OPNsense Unbound per-query log
    - selector: '{job="opnsense", program="filterlog"}'
      priority: 20              # higher priority wins
      period: 336h              # 14 days; raise once filterlog volume is measured
  max_query_length: 2400h       # default 721h would reject 90-day queries
  max_query_series: 2000        # default 500; 90d top-N panels exceed it
  split_queries_by_interval: 12h  # default 1h = 2160 subqueries over 90d

compactor:
  working_directory: /data/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 2h
