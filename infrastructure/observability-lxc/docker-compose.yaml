# Observability stack — CT405 (hl-observability-lxc) on Evo-X2.
# Metrics : VictoriaMetrics (scrapes node_exporters + receives vmagent remote_write from K8s)
# Logs    : Loki (+ Grafana Alloy shipper, added alongside)
# Viz     : Grafana (datasources auto-provisioned)
# Deploy  : clone this repo in CT405, `cp .env.example .env` (set Grafana pw), `docker compose up -d`.
name: observability   # pin project name so named volumes stay stable regardless of run dir

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.156.0
    container_name: victoriametrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - vm-data:/storage
      - ./scrape.yaml:/etc/vm/scrape.yaml:ro
    command:
      - "--storageDataPath=/storage"
      - "--retentionPeriod=90d"
      - "--promscrape.config=/etc/vm/scrape.yaml"
      - "--promscrape.configCheckInterval=30s"
      - "--httpListenAddr=0.0.0.0:8428"
    deploy:
      resources:
        limits:
          memory: 1024M

  loki:
    image: grafana/loki:3.7.10
    container_name: loki
    restart: unless-stopped
    user: "0"   # custom data path /data/loki isn't pre-owned in the image; run as root to write it
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/data/loki
      - ./loki.yaml:/etc/loki/loki.yaml:ro
    command: -config.file=/etc/loki/loki.yaml
    deploy:
      resources:
        limits:
          memory: 1536M

  grafana:
    image: grafana/grafana:13.2.6
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - TZ=America/Chicago   # alert message timestamps (templates.yaml) render in local time
      # One Gotify app token per alert category (contactpoints.yaml); set in .env (SOPS).
      - GOTIFY_TOKEN_CRITICAL=${GOTIFY_TOKEN_CRITICAL:-}
      - GOTIFY_TOKEN_SECURITY=${GOTIFY_TOKEN_SECURITY:-}
      - GOTIFY_TOKEN_KUBERNETES=${GOTIFY_TOKEN_KUBERNETES:-}
      - GOTIFY_TOKEN_NETWORK=${GOTIFY_TOKEN_NETWORK:-}
      - GOTIFY_TOKEN_INFRA=${GOTIFY_TOKEN_INFRA:-}
      # Public URL so alert/notification links resolve to NPM, not localhost:3000
      - GF_SERVER_DOMAIN=grafana.dkghar.duckdns.org
      - GF_SERVER_ROOT_URL=https://grafana.dkghar.duckdns.org
      - GF_SERVER_ENFORCE_DOMAIN=false   # NPM forwards Host; don't reject mismatches
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - victoriametrics
      - loki
    deploy:
      resources:
        limits:
          memory: 512M

  node-exporter:
    image: prom/node-exporter:v1.13.1
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"

  alloy:
    image: grafana/alloy:v1.22.0
    container_name: alloy
    restart: unless-stopped
    user: root   # needs to read /var/run/docker.sock (root:docker, mode 660)
    ports:
      - "1514:1514/udp"   # OPNsense remote syslog -> Loki
      - "1514:1514/tcp"
      - "1515:1515/tcp"   # OPNsense Unbound query log -> Loki (90d stream)
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki

  # OPNsense API exporter: gateway RTT/loss/status, pf states vs limit, per-interface
  # pf pass/block, WireGuard peers, services up/down, firmware updates, ARP, TCP states,
  # temperatures, mbufs. Complements Telegraf (system/NIC/Unbound) on 192.168.4.1:9273.
  # Internal-only: VictoriaMetrics scrapes it over the compose network (no published port).
  # API user/key: see README "OPNsense exporter". Key + secret live in .env (SOPS .env.enc.yaml).
  opnsense-exporter:
    image: ghcr.io/athennamind/opnsense-exporter:0.0.19
    container_name: opnsense-exporter
    restart: unless-stopped
    command:
      - --opnsense.protocol=https
      - --opnsense.address=192.168.4.1:3443   # OPNsense GUI/API port (not 443)
      - --opnsense.insecure            # OPNsense GUI uses its self-signed cert
      - --exporter.instance-label=opnsense
      - --web.listen-address=:8080
      - --log.format=json
      - --exporter.disable-ipsec       # no IPsec / OpenVPN / CARP on this firewall
      - --exporter.disable-openvpn
      - --exporter.disable-carp
      - --exporter.disable-kea-dhcpv4    # DHCP is dnsmasq; leases come from its logs instead
      - --exporter.disable-kea-dhcpv6
    environment:
      - OPNSENSE_EXPORTER_OPS_API_KEY=${OPNSENSE_API_KEY:-}
      - OPNSENSE_EXPORTER_OPS_API_SECRET=${OPNSENSE_API_SECRET:-}
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  vm-data:
  loki-data:
  grafana-data:
  alloy-data:
