apiVersion: 1

groups:
  - orgId: 1
    name: homelab-alerts
    folder: Homelab
    interval: 1m
    rules:
      # --- Log-based: K8s panic / fatal / CrashLoop across all namespaces (uses Loki) ---
      # noDataState=OK so a zero-match window doesn't fire (Grafana's default = Alerting).
      # execErrState=OK so a Loki blip doesn't fire either; we only want REAL spikes.
      - uid: k8s-error-log-spike
        title: K8s panic/fatal/CrashLoop log spike
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({job="loki.source.kubernetes.pods", namespace=~".+"} |~ "(?i)(panic|fatal|crashloopbackoff|oomkilled)" [10m]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              refId: C
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: 'Cluster panic/fatal/CrashLoop log lines spiking (last 10m)'
          description: 'Kubernetes Workloads dashboard, Logs panel, search panic|fatal for the namespace.'

      # --- Metric-based: any node-exporter scrape target down (uses VictoriaMetrics) ---
      # NoData here means VM itself is sick — DO fire that. ExecErr also fires.
      - uid: scrape-target-down
        title: Scrape target down
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Alerting
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'min by (host) (up{job=~"node-.*"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        labels:
          severity: critical
          category: infra
        annotations:
          summary: 'A node-exporter target is DOWN ({{ $labels.host }})'
          description: 'Is the host up? ssh to it and check systemctl status prometheus-node-exporter (or the node-exporter container).'

  # --- Suricata IDS (OPNsense EVE JSON via syslog -> Alloy -> Loki) ---
  # Severity 1-2 only; sev 3 is internet scan noise (Zmap etc.) — see the Suricata dashboard.
  # "ET SCAN *" is excluded too: bots probing WAN :80, which NPM only 301s to HTTPS.
  # What's left (ET EXPLOIT/MALWARE/TROJAN, outbound C2, ...) is worth a ping.
  # One instance per signature+source, so a new attacker/signature pings even mid-incident.
  # source=suricata routes it to gotify-ids (no resolve spam, 24h repeat) in policies.yaml.
  - orgId: 1
    name: security-alerts
    folder: Homelab
    interval: 1m
    rules:
      - uid: suricata-high-severity
        title: Suricata IDS alert
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum by (alert_signature, alert_severity, src_ip, dest_port) (count_over_time({job="opnsense", program="suricata"} | alert_severity=~"1|2" | alert_signature!~"ET SCAN .*" [5m]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: warning
          category: security
          source: suricata
        annotations:
          summary: '[sev {{ $labels.alert_severity }}] {{ $labels.alert_signature }} from {{ $labels.src_ip }} -> port {{ $labels.dest_port }} ({{ $values.A }} hits / 5m)'
          dashboardUid: opnsense-suricata

  # --- Kubernetes (kube-state-metrics + node-exporter via vmagent -> VictoriaMetrics) ---
  # Sleeping WOL workers are cordoned (kube_node_spec_unschedulable == 1); every rule that
  # could trip on them excludes those nodes. noDataState=OK: "nothing matched" is healthy.
  - orgId: 1
    name: kubernetes-alerts
    folder: Homelab
    interval: 1m
    rules:
      - uid: k8s-node-not-ready
        title: K8s node NotReady
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'count by (node) ((kube_node_status_condition{condition="Ready", status="true"} == 0) unless on (node) (kube_node_spec_unschedulable == 1))'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: critical
          category: kubernetes
        annotations:
          summary: 'Node {{ $labels.node }} is NotReady but not cordoned (not a WOL sleep)'
          description: 'kubectl describe node; talosctl -n <node IP> service kubelet / dmesg. Sleeping WOL nodes are excluded, so this one should be awake.'
          dashboardUid: k8s-cluster
      - uid: k8s-pod-crashlooping
        title: K8s container restarting repeatedly
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[15m]))'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
              refId: C
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) restarted {{ $values.A }} times in 15m'
          description: 'kubectl -n <ns> logs <pod> --previous; Kubernetes Workloads dashboard shows the last termination reason.'
          dashboardUid: k8s-workloads
      - uid: k8s-container-oomkilled
        title: K8s container OOMKilled
        condition: C
        for: 0s
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'sum by (namespace, pod, container) (increase(kube_pod_container_status_restarts_total[10m]) and on (namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1))'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) was OOMKilled: raise its memory limit'
          description: 'Raise resources.limits.memory in the manifest, or check Memory vs limit on Kubernetes Cluster for a leak.'
          dashboardUid: k8s-workloads
      # DaemonSet pods parked Pending on sleeping WOL nodes are excluded.
      - uid: k8s-pod-not-healthy
        title: K8s pod stuck Pending/Failed
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'count by (namespace, pod) ((kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} == 1) unless on (namespace, pod) (kube_pod_info and on (node) (kube_node_spec_unschedulable == 1)))'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.pod }} not running for 15m'
          description: 'kubectl -n <ns> describe pod: look at Events (scheduling, image pull, PVC).'
          dashboardUid: k8s-cluster
      - uid: k8s-workload-degraded
        title: K8s workload below desired replicas
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (namespace, deployment) (kube_deployment_spec_replicas - kube_deployment_status_replicas_available) or max by (namespace, statefulset) (kube_statefulset_replicas - kube_statefulset_status_replicas_ready)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: '{{ $labels.namespace }}/{{ $labels.deployment }}{{ $labels.statefulset }} is missing {{ $values.A }} replica(s)'
          description: 'kubectl -n <ns> get pods: a pod is not Ready; check its events and logs.'
          dashboardUid: k8s-cluster
      - uid: k8s-node-var-full
        title: K8s node /var filling up
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: '100 * (1 - max by (node) (node_filesystem_avail_bytes{job="kubernetes-node-exporter", mountpoint="/var"}) / max by (node) (node_filesystem_size_bytes{job="kubernetes-node-exporter", mountpoint="/var"}))'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
              refId: C
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: '{{ $labels.node }} /var is {{ printf "%.0f" $values.A.Value }}% full (local-path PVCs + images); kubelet evicts at ~90%'
          description: 'Usually images or local-path PVCs. talosctl -n <node IP> image prune, or move a PVC.'
          dashboardUid: k8s-cluster
      - uid: flux-not-ready
        title: Flux resource not Ready
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'count by (customresource_kind, exported_namespace, name) (gotk_resource_info{ready="False"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: 'Flux {{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} is failing to reconcile'
          description: 'flux get all -A; flux logs --level=error. Usually a bad manifest in the last merge.'
          dashboardUid: k8s-cluster
      # Exporters other alerts depend on. (node-* LXC exporters are covered by scrape-target-down.)
      - uid: monitoring-exporter-down
        title: Monitoring exporter down
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'min by (job) (up{job=~"kube-state-metrics|apiserver|coredns|opnsense-exporter|alloy-observability|telegraf-opnsense|n8n"}) or label_replace(min(opnsense_up), "job", "opnsense-api", "", "")'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        labels:
          severity: critical
          category: infra
        annotations:
          summary: 'Scrape job {{ $labels.job }} is down: its dashboards and alerts are blind (n8n = the outside watchdog for Grafana is down too)'
          description: 'Dashboards and alerts built on this job are blind until it is back. opnsense-api = exporter up but API key/permissions failing.'

      - uid: k8s-job-failed
        title: K8s Job failed
        condition: C
        for: 1m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (namespace, job_name) (kube_job_status_failed)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: 'Job {{ $labels.namespace }}/{{ $labels.job_name }} failed'
          description: 'kubectl -n {{ $labels.namespace }} logs job/{{ $labels.job_name }}. Delete the failed Job after fixing, or this keeps firing.'
      - uid: k8s-kubelet-cert-expiring
        title: Kubelet client certificate expiring
        condition: C
        for: 1h
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'min(kubelet_certificate_manager_client_ttl_seconds) / 86400'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [14]
              refId: C
        labels:
          severity: warning
          category: kubernetes
        annotations:
          summary: 'Kubelet client certificate expires in {{ printf "%.0f" $values.A.Value }} days'
          description: 'Talos rotates these on its own, so rotation is stuck. Check kubelet logs: talosctl -n <node> logs kubelet | grep -i cert.'

  # --- OPNsense (opnsense-exporter API metrics) ---
  - orgId: 1
    name: opnsense-alerts
    folder: Homelab
    interval: 1m
    rules:
      # status 0 = offline. 6 (forced offline) is deliberate and ignored.
      - uid: opnsense-gateway-down
        title: OPNsense gateway offline
        condition: C
        for: 2m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'count by (name) (opnsense_gateways_status == 0)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: critical
          category: network
        annotations:
          summary: 'Gateway {{ $labels.name }} is offline (dpinger)'
          description: 'WAN down or the monitor IP (8.8.8.8) unreachable. Check modem/ISP; OPNsense Health dashboard.'
          dashboardUid: opnsense-health
      - uid: opnsense-gateway-loss
        title: OPNsense gateway packet loss
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (name) (opnsense_gateways_loss_percentage)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
              refId: C
        labels:
          severity: warning
          category: network
        annotations:
          summary: 'Gateway {{ $labels.name }} losing {{ $values.A }}% of probes for 10m'
          description: 'Upstream congestion or a flaky modem link. Compare with the speedtest panel on OPNsense Network.'
          dashboardUid: opnsense-health
      - uid: opnsense-pf-states-high
        title: OPNsense pf state table filling
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: '100 * max(opnsense_pf_states_current) / max(opnsense_pf_states_limit)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
              refId: C
        labels:
          severity: warning
          category: network
        annotations:
          summary: 'pf state table at {{ printf "%.0f" $values.A.Value }}% of limit: new connections will be dropped at 100%'
          description: 'A device opening huge numbers of connections. OPNsense Firewall, Top LAN clients table.'
          dashboardUid: opnsense-health
      - uid: opnsense-service-stopped
        title: OPNsense service stopped
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'count by (name, description) (opnsense_services_status == 0)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: warning
          category: network
        annotations:
          summary: 'OPNsense service {{ $labels.description }} ({{ $labels.name }}) is stopped'
          description: 'OPNsense System > Diagnostics > Services: start it and check its log.'
          dashboardUid: opnsense-health
      - uid: opnsense-logs-stopped
        title: OPNsense logs stopped arriving
        condition: C
        for: 15m
        noDataState: Alerting
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              expr: 'sum(count_over_time({job="opnsense", program="filterlog"}[15m]))'
              queryType: instant
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C
        labels:
          severity: warning
          category: network
        annotations:
          summary: 'No OPNsense filterlog lines in Loki for 15m: firewall/IDS log alerts and dashboards are blind'
          description: 'OPNsense System > Settings > Logging > Remote (target enabled?), then Alloy on CT405: docker compose logs alloy | tail.'
      - uid: opnsense-cpu-hot
        title: OPNsense CPU hot
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max(opnsense_temperature_celsius{type="cpu"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
              refId: C
        labels:
          severity: warning
          category: network
        annotations:
          summary: 'OPNsense CPU at {{ printf "%.0f" $values.A.Value }}°C'
          description: 'Check the box airflow; Suricata or a traffic flood can also pin the CPU (OPNsense Health dashboard).'
          dashboardUid: opnsense-health
      - uid: opnsense-disk-filling
        title: OPNsense disk filling
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max(disk_used_percent{job="telegraf-opnsense", path="/"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
              refId: C
        labels:
          severity: warning
          category: network
        annotations:
          summary: 'OPNsense root filesystem {{ printf "%.0f" $values.A.Value }}% full'
          description: 'Usually local logs or Suricata EVE: System > Settings > Logging (retention), Services > Intrusion Detection > log rotation.'
      - uid: opnsense-memory-high
        title: OPNsense memory high
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max(mem_used_percent{job="telegraf-opnsense"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
              refId: C
        labels:
          severity: warning
          category: network
        annotations:
          summary: 'OPNsense memory {{ printf "%.0f" $values.A.Value }}% used'
          description: 'Diagnostics > Activity, sorted by RES. Suricata rule sets and Unbound cache are the big consumers.'
          dashboardUid: opnsense-health
      - uid: opnsense-wan-latency-high
        title: WAN latency high
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (name) (opnsense_gateways_rtt_milliseconds)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [100]
              refId: C
        labels:
          severity: warning
          category: network
        annotations:
          summary: 'Gateway {{ $labels.name }} RTT {{ printf "%.0f" $values.A.Value }} ms (normal < 10 ms)'
          description: 'ISP congestion or a LAN device saturating the uplink: OPNsense Firewall dashboard, top talkers.'
          dashboardUid: opnsense-health

  # --- Hosts, disks, backups (node-exporter + textfile collectors on evox2/peladn/LXCs) ---
  # LXCs share the host kernel and bind-mounted disks, so a DAS problem can show on both
  # home-ops-lxc and media-ai-ops-lxc; the infra route groups them into one message.
  - orgId: 1
    name: host-alerts
    folder: Homelab
    interval: 1m
    rules:
      - uid: host-disk-filling
        title: Host disk filling
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (host, mountpoint) (100 * (1 - node_filesystem_avail_bytes{job=~"node-.*", fstype=~"ext4|xfs|btrfs|zfs"} / node_filesystem_size_bytes{job=~"node-.*", fstype=~"ext4|xfs|btrfs|zfs"})) < 95'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
              refId: C
        labels:
          severity: warning
          category: infra
        annotations:
          summary: '{{ $labels.host }} {{ $labels.mountpoint }} is {{ printf "%.0f" $values.A.Value }}% full'
          description: 'du -xh --max-depth=2 {{ $labels.mountpoint }} | sort -h | tail. Usual suspects: docker images (docker system df), logs, old backups.'
      - uid: host-disk-full
        title: Host disk almost full
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (host, mountpoint) (100 * (1 - node_filesystem_avail_bytes{job=~"node-.*", fstype=~"ext4|xfs|btrfs|zfs"} / node_filesystem_size_bytes{job=~"node-.*", fstype=~"ext4|xfs|btrfs|zfs"}))'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [95]
              refId: C
        labels:
          severity: critical
          category: infra
        annotations:
          summary: '{{ $labels.host }} {{ $labels.mountpoint }} is {{ printf "%.0f" $values.A.Value }}% full: writes will start failing'
          description: 'Free space now: docker system prune, journalctl --vacuum-size=200M, or move data off {{ $labels.mountpoint }}.'
      - uid: host-disk-full-in-24h
        title: Host disk full within 24h
        condition: C
        for: 1h
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (host, mountpoint) (predict_linear(node_filesystem_avail_bytes{job=~"node-.*", fstype=~"ext4|xfs|btrfs|zfs"}[6h], 86400) < 0 and on (host, mountpoint) (100 * (1 - node_filesystem_avail_bytes{job=~"node-.*", fstype=~"ext4|xfs|btrfs|zfs"} / node_filesystem_size_bytes{job=~"node-.*", fstype=~"ext4|xfs|btrfs|zfs"})) > 70)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0]
              refId: C
        labels:
          severity: warning
          category: infra
        annotations:
          summary: '{{ $labels.host }} {{ $labels.mountpoint }} will be full within 24h at the current write rate'
          description: 'Something is writing fast: check recent big files (find {{ $labels.mountpoint }} -xdev -mmin -360 -size +500M) and runaway logs.'
      - uid: external-disk-missing
        title: External disk mount missing
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: '(3 - count by (host) (node_filesystem_size_bytes{job=~"node-(home-ops|media-ai-ops)-lxc", mountpoint=~"/mnt/(das|sg-ext-hdd|wd-ext-hdd)"})) or on (host) (3 * max by (host) (up{job=~"node-(home-ops|media-ai-ops)-lxc"}))'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: critical
          category: infra
        annotations:
          summary: '{{ printf "%.0f" $values.A.Value }} of 3 external mounts (DAS / USB HDDs) missing on {{ $labels.host }}'
          description: 'USB/DAS disconnect? On peladn: lsblk, dmesg -T | grep -iE "usb|uas|reset" | tail -30. Re-mount, then restart the LXC so its bind mounts come back.'
      - uid: filesystem-readonly
        title: Filesystem went read-only
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (host, mountpoint) (node_filesystem_readonly{job=~"node-.*", fstype=~"ext4|xfs|btrfs|zfs"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: critical
          category: infra
        annotations:
          summary: '{{ $labels.host }} {{ $labels.mountpoint }} is mounted READ-ONLY (I/O errors?)'
          description: 'The kernel remounts read-only after disk errors. dmesg -T | grep -iE "error|xfs|ext4" | tail, then check SMART before remounting.'
      - uid: host-memory-low
        title: Host memory low
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'min by (host) (100 * node_memory_MemAvailable_bytes{job=~"node-.*"} / node_memory_MemTotal_bytes{job=~"node-.*"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [10]
              refId: C
        labels:
          severity: warning
          category: infra
        annotations:
          summary: '{{ $labels.host }} has only {{ printf "%.0f" $values.A.Value }}% memory available'
          description: 'Top consumers: ps aux --sort=-rss | head (or docker stats --no-stream). The OOM killer is next.'
      - uid: host-cpu-hot
        title: Host running hot
        condition: C
        for: 1h
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (host) (node_hwmon_temp_celsius{job=~"node-(evox2|peladn)", chip!~"nvme.*"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [95]
              refId: C
        labels:
          severity: warning
          category: infra
        annotations:
          summary: '{{ $labels.host }} has been above 95°C for an hour ({{ printf "%.0f" $values.A.Value }}°C now)'
          description: 'Short inference bursts near 100°C are normal on evox2; an hour is not. Stuck workload (Ollama, top) or blocked airflow/fan.'
      - uid: disk-temperature-high
        title: Disk temperature high
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (host, disk) (smartmon_temperature_celsius_raw_value) > 55 or max by (host, device) (nvme_temperature_celsius) > 75'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: warning
          category: infra
        annotations:
          summary: '{{ $labels.host }} disk {{ $labels.disk }}{{ $labels.device }} at {{ printf "%.0f" $values.A.Value }}°C'
          description: 'HDD limit ~55°C, NVMe ~75°C. Check enclosure airflow/fan; long scrubs or backups heat the DAS.'
      - uid: disk-smart-unhealthy
        title: Disk SMART health failed
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (host, disk) (1 - smartmon_device_smart_healthy) or max by (host, device) (nvme_critical_warning)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: critical
          category: infra
        annotations:
          summary: '{{ $labels.host }} disk {{ $labels.disk }}{{ $labels.device }} reports SMART FAILURE / critical warning'
          description: 'The drive predicts its own failure. Check smartctl -a; make sure its data has a fresh backup, then replace it.'
      - uid: disk-bad-sectors
        title: Disk has bad sectors
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'sum by (host, disk) ({__name__=~"smartmon_(reallocated_sector_ct|current_pending_sector|offline_uncorrectable)_raw_value"}) or max by (host, device) (increase(nvme_media_errors_total[1d]))'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: warning
          category: infra
        annotations:
          summary: '{{ $labels.host }} disk {{ $labels.disk }}{{ $labels.device }}: {{ printf "%.0f" $values.A.Value }} reallocated/pending/uncorrectable sectors or new media errors'
          description: 'Early sign of a dying disk. smartctl -a {{ $labels.disk }}; if the count grows, plan a replacement. Silence once acknowledged if it stays flat.'
      - uid: systemd-unit-failed
        title: systemd unit failed
        condition: C
        for: 15m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (host, name) (node_systemd_unit_state{job=~"node-.*", state="failed", name!="openipmi.service"})'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: warning
          category: infra
        annotations:
          summary: '{{ $labels.name }} failed on {{ $labels.host }}'
          description: 'systemctl status {{ $labels.name }}; journalctl -u {{ $labels.name }} -n 50. Fix, then systemctl reset-failed {{ $labels.name }}.'
      - uid: backup-stale
        title: Backup overdue
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (host, kind, name) (homelab_backup_age_seconds - homelab_backup_max_age_seconds) / 3600'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C
        labels:
          severity: warning
          category: infra
        annotations:
          summary: 'Backup {{ $labels.name }} ({{ $labels.kind }}) is {{ printf "%.0f" $values.A.Value }}h past its max age'
          description: 'pbs: check the backup job and task log in PBS. db-dump/etcd: systemctl list-timers on {{ $labels.host }} and the job journal.'
      - uid: metrics-textfile-stale
        title: Textfile metrics stale
        condition: C
        for: 30m
        noDataState: OK
        execErrState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: victoriametrics
            model:
              datasource:
                type: prometheus
                uid: victoriametrics
              expr: 'max by (host, file) (time() - node_textfile_mtime_seconds{job=~"node-.*"}) / 3600'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
              refId: C
        labels:
          severity: warning
          category: infra
        annotations:
          summary: '{{ $labels.file }} on {{ $labels.host }} not refreshed for {{ printf "%.0f" $values.A.Value }}h: backup/SMART/apt alerts on it are blind'
          description: 'The timer that writes it stopped: systemctl list-timers --all on {{ $labels.host }}, then the matching service journal.'
