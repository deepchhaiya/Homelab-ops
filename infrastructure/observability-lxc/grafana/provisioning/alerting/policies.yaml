apiVersion: 1

# Routing: first matching route wins (no `continue`).
#   1. severity=critical -> Critical app, any category, never muted, re-sent hourly.
#   2. category=security -> Security app, never muted, one ping per signature+source a day.
#   3. kubernetes / network / infra warnings -> their own app, muted 23:00-07:00
#      (mute-timings.yaml). A warning still firing at 07:00 is delivered then.
# Every rule in rules.yaml carries `severity` and `category` labels.
policies:
  - orgId: 1
    receiver: grafana-infra          # fallback for any rule missing a category label
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 12h
    routes:
      - receiver: grafana-critical
        object_matchers:
          - ['severity', '=', 'critical']
        group_wait: 10s
        repeat_interval: 1h

      - receiver: grafana-security
        object_matchers:
          - ['category', '=', 'security']
        group_by: ['alertname', 'alert_signature', 'src_ip']
        group_wait: 10s
        repeat_interval: 24h

      - receiver: grafana-kubernetes
        object_matchers:
          - ['category', '=', 'kubernetes']
        group_by: ['alertname', 'namespace']
        mute_time_intervals: [night]

      - receiver: grafana-network
        object_matchers:
          - ['category', '=', 'network']
        mute_time_intervals: [night]

      - receiver: grafana-infra
        object_matchers:
          - ['category', '=', 'infra']
        mute_time_intervals: [night]
