apiVersion: 1

policies:
  - orgId: 1
    receiver: gotify
    group_by: ['grafana_folder', 'alertname']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: gotify-ids
        object_matchers:
          - ['source', '=', 'suricata']
        group_by: ['alertname', 'alert_signature', 'src_ip']
        group_wait: 10s
        repeat_interval: 24h
