# /etc/systemd/system/ollama.service.d/override.conf
#
# Drops in on top of the Ollama installer's default systemd unit on the Evo-X2 host.
# Tuned for AMD Strix Halo (Radeon 8060S, gfx1151) — Phase 22a, 2026-05-26.
#
# After editing: `systemctl daemon-reload && systemctl restart ollama`
[Service]

# Listen on LAN (firewalled by /etc/nftables.d/ollama.conf — LAN-only)
Environment="OLLAMA_HOST=0.0.0.0"

# Tell HIP runtime to use gfx1150 kernels on the gfx1151 chip — most reliable detection path
Environment="HSA_OVERRIDE_GFX_VERSION=11.5.0"

# Disable SDMA — Strix Halo stability hint per AMD ROCm working guide
Environment="HSA_ENABLE_SDMA=0"

# Performance + capacity
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
# REQUIRED since the Ollama upgrade that added the integrated-GPU gate.
# Without this, Ollama DETECTS the Radeon 8060S (library=ROCm compute=gfx1150)
# and then logs "dropping integrated GPU; to enable, set OLLAMA_IGPU_ENABLE=1",
# silently falling back to CPU inference. Symptoms: api/ps shows size_vram=0,
# llama-server pegs ~17 cores at 23 GB RSS, and a 35B summarisation takes ~20 s
# instead of ~5 s. Verified 2026-09-13: enabling this gave 70.7 tok/s and
# size_vram=22.1 GB. (Found while debugging n8n curator-brief timeouts.)
Environment="OLLAMA_IGPU_ENABLE=1"
# 2 vs 4 benchmarked on GPU 2026-09-13 (8 concurrent): 10.5 vs 11.9 items/min.
# Only ~13% - the iGPU is memory-bandwidth-bound - but free, and it stops
# Open WebUI queueing behind the nightly curator brief.
Environment="OLLAMA_NUM_PARALLEL=4"

# Default context window. Ollama otherwise truncates every prompt to ~4K, which
# breaks agentic coding tools (Cline/Roo/Continue in VS Code) — they send large
# multi-file prompts. qwen3.6 supports 256K; 32K is a good local balance (agent
# has room, prompt-eval stays fast). Cheap here thanks to q8_0 KV cache + flash
# attn on 71 GiB VRAM.
# 32768 -> 65536 on 2026-09-13: Hermes Agent requires >=64K (its
# MINIMUM_CONTEXT_LENGTH) and is configured for context_length 64000, so at 32K
# its ~29K-token prompts left only ~3K for qwen3.6's thinking -> generation hit
# the slot limit (Ollama "truncated = 1") -> Hermes "Response truncated
# (finish_reason='length')" in Open WebUI. Prompts >32K were also silently cut
# to 16K ("truncating input prompt"). Hermes' own num_ctx is not honoured on the
# /v1 endpoint, so this server default is what actually sets the window.
Environment="OLLAMA_CONTEXT_LENGTH=65536"

# Keep models resident for snappy responses — pin -1 (forever) or a duration like 24h
Environment="OLLAMA_KEEP_ALIVE=3h"
