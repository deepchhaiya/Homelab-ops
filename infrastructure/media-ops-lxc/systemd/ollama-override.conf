[Service]
Environment="OLLAMA_HOST=0.0.0.0"
Environment="HSA_OVERRIDE_GFX_VERSION=11.0.0"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=2"

#Environment="OLLAMA_NUM_PARALLEL=4"
#Environment="OLLAMA_MAX_LOADED_MODELS=2"
# 2026-10-27: run on Vulkan (RADV) instead of ROCm. ROCm/KFD compute queues on this
# 780M (gfx1103) hit the MES REMOVE_QUEUE hang -> GPU reset (ROCm/TheRock#9285).
# Vulkan is experimental in Ollama 0.23 (opt-in); an invalid ROCm device ID hides the GPU from ROCm.
# Rollback: restore override.conf.pre-vulkan-20261027.
Environment="OLLAMA_VULKAN=1"
Environment="ROCR_VISIBLE_DEVICES=-1"
