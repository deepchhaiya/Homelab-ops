- id: '1743706697577'
  alias: Close Garage door after 15 mins
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - number.ghar_garage_door_dooropenduration
    for:
      hours: 0
      minutes: 30
      seconds: 0
  conditions:
  - condition: and
    conditions:
    - type: is_no_motion
      condition: device
      device_id: 806543fc92346d737eb7334dd6c4cbf8
      entity_id: e7d9afc31862429e32139f5ef286aa1f
      domain: binary_sensor
      for:
        hours: 0
        minutes: 5
        seconds: 0
    - condition: state
      entity_id: binary_sensor.garage_crossline_garage_proximity_person
      state:
      - 'off'
      - unavailable
      - unknown
      for:
        hours: 0
        minutes: 3
        seconds: 0
  actions:
  - delay:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
  - if:
    - condition: and
      conditions:
      - condition: state
        entity_id: binary_sensor.garage_crossline_garage_proximity_person
        state:
        - 'off'
      - type: is_no_motion
        condition: device
        device_id: 806543fc92346d737eb7334dd6c4cbf8
        entity_id: e7d9afc31862429e32139f5ef286aa1f
        domain: binary_sensor
      - condition: state
        entity_id: binary_sensor.garage_crossline_garage_proximity_animal
        state:
        - 'off'
        enabled: false
      - condition: state
        entity_id: binary_sensor.garage_crossline_garage_proximity_vehicle
        state:
        - 'off'
    then:
    - action: persistent_notification.create
      metadata: {}
      data:
        message: Closing Garage door in 2 minutes.
        title: Closing Garage door in 2 mins
        notification_id: Garage_door_close
    - device_id: 374fab6011d6c1ca40776b2ab180edba
      domain: cover
      entity_id: 1c80fc158309b8fd913549d6c963082b
      type: close
    - action: notify.notify
      metadata: {}
      data:
        message: Garage Door closed after 15 minutes and 5 minutes of no motion
        title: Ghar Garage Door Closed
    - action: persistent_notification.dismiss
      metadata: {}
      data:
        notification_id: Garage_door_close
  mode: single
- id: '1743724882734'
  alias: Front Entrance Door Open
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.front_garage_entrance_door
    to: 'on'
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions: []
  actions:
  - variables:
      snapshot_time: '{{ now().strftime(''%Y%m%d_%H%M%S'') }}'
  - sequence:
