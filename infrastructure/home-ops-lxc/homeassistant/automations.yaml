    device_id: a738b1433310ce7349c22435a38d7c23
    entity_id: e6012312befac54e09ce69e5bf35536d
    domain: sensor
    trigger: device
    above: 90
    alias: Server Room Temp > 90
  conditions:
  - condition: state
    entity_id: climate.hallway_thermostat
    attribute: hvac_action
    state:
    - idle
    for:
      hours: 0
      minutes: 5
      seconds: 0
  actions:
  - action: fan.set_percentage
    metadata: {}
    target:
      entity_id:
      - fan.rack_fans_rack_fan_1
      - fan.rack_fans_rack_fan_2
    data:
      percentage: 85
  - action: climate.set_fan_mode
    metadata: {}
    target:
      device_id: 8ce253546c37d62d0daedd3a8cf7e821
    data:
      fan_mode: 'on'
  - delay:
      hours: 0
      minutes: 15
      seconds: 0
      milliseconds: 0
  - action: climate.set_fan_mode
    metadata: {}
    target:
      device_id: 8ce253546c37d62d0daedd3a8cf7e821
    data:
