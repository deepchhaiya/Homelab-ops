      data:
        message: Close the front/garage entrance door. It's open for more then 5 minutes!
        title: 'Front/Garage Entrance door open '
        data:
          image: https://homeassistant.dkghar.duckdns.org/local/arlo_snapshots_videos/front_doorbell/frontdoor_open__{{snapshot_time
            }}.jpg
  mode: single
