- id: '1777332982601'
  alias: HVAC home temperature Automation
  description: Control cooling based on temperature and humidity including bedroom
    sensor
  triggers:
  - entity_id:
    - sensor.bedroom_cool_diff
    above: 1
    for:
      hours: 0
      minutes: 1
      seconds: 2
    id: bedroom_temp_high
    trigger: numeric_state
    enabled: true
  - entity_id:
    - sensor.bedroom_heat_diff
    above: 1
    for:
      hours: 0
      minutes: 1
      seconds: 2
    id: bedroom_temp_low
    trigger: numeric_state
    enabled: true
  - type: temperature
    device_id: fd37b076c6923e30c30aebef04ef3627
    entity_id: 5ac0ffc4791105eb8138a777d39852dd
    domain: sensor
    trigger: device
    above: 81
    for:
      hours: 0
      minutes: 3
      seconds: 0
    enabled: false
  conditions:
  - condition: state
    entity_id: climate.hallway_thermostat
    attribute: hvac_action
    state:
    - idle
    for:
      hours: 0
      minutes: 15
      seconds: 0
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: sensor.bedroom_heat_diff
      above: 1
    - condition: numeric_state
      entity_id: sensor.bedroom_cool_diff
      above: 1
  actions:
  - variables:
      bedroom_temp: '{{ states(''sensor.bedroom_t_h_sensor_temperature'') | float(0)
        }}'
      heat_set: '{{ states(''sensor.thermostat_heat_set_temperature'') | float(0)
        }}'
      cool_set: '{{ states(''sensor.thermostat_cool_set_temperature'') | float(0)
        }}'
      thermostat_current_temp: '{{ states(''sensor.hallway_thermostat_temperature'')
        | float(0) }}'
      cool_diff: '{{ states(''sensor.bedroom_cool_diff'') | float(0) }}'
      heat_diff: '{{ states(''sensor.bedroom_heat_diff'') | float(0) }}'
      hvac_mode: '{{ states(''climate.hallway_thermostat'') }}'
      temp_cushion_for_set: 1
      temp_cushion_for_compare: 0.5
  - choose:
    - alias: If bedroom is hotter than hallway setpoint and hvac_mode is heat_cool,
        lower the cooling temperature
      conditions:
      - condition: and
        conditions:
        - condition: template
          value_template: '{{ hvac_mode == ''heat_cool'' }}'
        - condition: template
          value_template: '{{ bedroom_temp > (cool_set + temp_cushion_for_set) }}'
      sequence:
      - action: climate.set_fan_mode
        metadata: {}
        target:
          entity_id: climate.hallway_thermostat
        data:
          fan_mode: 'on'
      - delay:
          hours: 0
          minutes: 3
          seconds: 0
          milliseconds: 0
      - alias: Lower Cooling Temp
        action: climate.set_temperature
        target:
          entity_id: climate.hallway_thermostat
        data:
          target_temp_low: '{{ heat_set }}'
          target_temp_high: '{{ cool_set - cool_diff - temp_cushion_for_set }}'
          hvac_mode: heat_cool
      - action: timer.start
        metadata: {}
        target:
          entity_id: timer.bedroom_temp_control_timer
        data: {}
      - delay:
          minutes: 4
      - alias: Wait until bedroom temp drops below cushioned cool threshold
        repeat:
          sequence:
          - delay:
              hours: 0
              minutes: 2
              seconds: 0
              milliseconds: 0
          until:
          - condition: or
            conditions:
            - alias: If bedroom temp lower then thermostat
              condition: template
              value_template: '{{ states(''sensor.bedroom_t_h_sensor_temperature'')
                | float(0) <= (cool_set - temp_cushion_for_compare) }}'
            - condition: state
              entity_id: timer.bedroom_temp_control_timer
              state:
              - idle
      - alias: Reset to original hallway band
        action: climate.set_temperature
        target:
          entity_id: climate.hallway_thermostat
        data:
          target_temp_low: '{{ heat_set }}'
          target_temp_high: '{{ cool_set }}'
          hvac_mode: heat_cool
    - alias: If bedroom is cooler than hallway setpoint and hvac mode is heat_cool,
        raise heating temperature
      conditions:
      - condition: and
        conditions:
        - condition: template
          value_template: '{{ hvac_mode == ''heat_cool'' }}'
        - condition: template
          value_template: '{{ bedroom_temp < (heat_set - temp_cushion_for_set) }}'
      sequence:
      - action: climate.set_fan_mode
        metadata: {}
        target:
          entity_id: climate.hallway_thermostat
        data:
          fan_mode: 'on'
      - delay:
          hours: 0
          minutes: 2
          seconds: 0
          milliseconds: 0
      - alias: Increase the heating temperature
        action: climate.set_temperature
        target:
          entity_id: climate.hallway_thermostat
        data:
          target_temp_low: '{{ heat_set + heat_diff + temp_cushion_for_set }}'
          target_temp_high: '{{ cool_set }}'
          hvac_mode: heat_cool
      - action: timer.start
        metadata: {}
        target:
          entity_id: timer.bedroom_temp_control_timer
        data: {}
      - delay:
          minutes: 4
      - alias: Wait until bedroom temp rises above cushioned heat threshold
        repeat:
          sequence:
          - delay:
              hours: 0
              minutes: 2
              seconds: 0
              milliseconds: 0
          until:
          - condition: or
            conditions:
            - condition: template
              value_template: '{{ states(''sensor.bedroom_t_h_sensor_temperature'')
                | float(0) >= (heat_set + temp_cushion_for_compare) }}'
            - condition: state
              entity_id: timer.bedroom_temp_control_timer
              state:
              - idle
      - alias: Reset to original hallway band
        action: climate.set_temperature
        target:
          entity_id: climate.hallway_thermostat
        data:
          target_temp_low: '{{ heat_set }}'
          target_temp_high: '{{ cool_set }}'
          hvac_mode: heat_cool
    - alias: If bedroom is hotter than hallway setpoint and hvac mode is cool, lower
        the cooling temperature
      conditions:
      - condition: and
        conditions:
        - condition: template
          value_template: '{{ hvac_mode == ''cool'' }}'
        - condition: template
          value_template: '{{ bedroom_temp > (cool_set + temp_cushion_for_set) }}'
      sequence:
      - action: climate.set_fan_mode
        metadata: {}
        target:
          entity_id: climate.hallway_thermostat
        data:
          fan_mode: 'on'
      - delay:
          hours: 0
          minutes: 3
          seconds: 0
          milliseconds: 0
      - alias: Lower Cooling Temp
        action: climate.set_temperature
        target:
          entity_id: climate.hallway_thermostat
        data:
          hvac_mode: cool
          temperature: '{{ cool_set - cool_diff - temp_cushion_for_set }}'
      - action: timer.start
        metadata: {}
        target:
          entity_id: timer.bedroom_temp_control_timer
        data: {}
      - delay:
          minutes: 4
      - alias: Wait until bedroom temp drops below cushioned cool threshold
        repeat:
          sequence:
          - delay:
              hours: 0
              minutes: 2
              seconds: 0
              milliseconds: 0
          until:
          - condition: or
            conditions:
            - condition: template
              value_template: '{{ states(''sensor.bedroom_t_h_sensor_temperature'')
                | float(0) <= (cool_set - temp_cushion_for_compare) }}'
            - condition: state
              entity_id: timer.bedroom_temp_control_timer
              state:
              - idle
      - alias: Reset to original hallway band
        action: climate.set_temperature
        target:
          entity_id: climate.hallway_thermostat
        data:
          hvac_mode: cool
          temperature: '{{ cool_set }}'
    - alias: If bedroom is cooler than hallway setpoint and hvac mode is heat, raise
        heating temperature
      conditions:
      - condition: and
        conditions:
        - condition: template
          value_template: '{{ hvac_mode == ''heat'' }}'
        - condition: template
          value_template: '{{ bedroom_temp < (heat_set - temp_cushion_for_set) }}'
      sequence:
      - action: climate.set_fan_mode
        metadata: {}
        target:
          entity_id: climate.hallway_thermostat
        data:
          fan_mode: 'on'
      - delay:
          hours: 0
          minutes: 2
          seconds: 0
          milliseconds: 0
      - alias: Increase the heating temperature
        action: climate.set_temperature
        target:
          entity_id: climate.hallway_thermostat
        data:
          hvac_mode: heat
          temperature: '{{ heat_set + heat_diff + temp_cushion_for_set }}'
      - action: timer.start
        metadata: {}
        target:
          entity_id: timer.bedroom_temp_control_timer
        data: {}
      - delay:
          minutes: 4
      - alias: Wait until bedroom temp rises above cushioned heat threshold
        repeat:
          sequence:
          - delay:
              hours: 0
              minutes: 2
              seconds: 0
              milliseconds: 0
          until:
          - condition: or
            conditions:
            - condition: template
              value_template: '{{ states(''sensor.bedroom_t_h_sensor_temperature'')
                | float(0) >= (heat_set + temp_cushion_for_compare) }}'
            - condition: state
              entity_id: timer.bedroom_temp_control_timer
              state:
              - idle
      - alias: Reset to original hallway band
        action: climate.set_temperature
        target:
          entity_id: climate.hallway_thermostat
        data:
          hvac_mode: heat
          temperature: '{{ heat_set }}'
    default:
    - action: climate.set_fan_mode
      metadata: {}
      data:
        fan_mode: 'off'
      target:
        device_id: 8ce253546c37d62d0daedd3a8cf7e821
    - action: automation.trigger
      metadata: {}
      target:
        entity_id: automation.rack_fan_speed_automation
      data:
        skip_condition: true
    - alias: Reset to original hallway band
      action: climate.set_temperature
      target:
        entity_id: climate.hallway_thermostat
      data:
        target_temp_low: '{{ heat_set }}'
        target_temp_high: '{{ cool_set }}'
        hvac_mode: heat_cool
  - action: climate.set_fan_mode
    metadata: {}
    data:
      fan_mode: 'off'
    target:
      device_id: 8ce253546c37d62d0daedd3a8cf7e821
  - action: automation.trigger
    metadata: {}
    target:
      entity_id: automation.rack_fan_speed_automation
    data:
      skip_condition: true
    enabled: true
  mode: queued
  max: 2
- id: '1778546295189'
