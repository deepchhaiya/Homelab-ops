- id: '1779646759466'
  alias: Rack Fan Speed Automation
  description: Increasing/Decreasing fan speed based on server room temperature if
    manual mode is off.
  triggers:
  - alias: Server room temp above 87
    type: temperature
    device_id: a738b1433310ce7349c22435a38d7c23
    entity_id: e6012312befac54e09ce69e5bf35536d
    domain: sensor
    trigger: device
    above: 87
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - alias: Server room temp between 84 and 87
    type: temperature
    device_id: a738b1433310ce7349c22435a38d7c23
    entity_id: e6012312befac54e09ce69e5bf35536d
    domain: sensor
    trigger: device
    above: 84
    below: 87
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - alias: Server room temp between 81 and 84
    type: temperature
    device_id: a738b1433310ce7349c22435a38d7c23
    entity_id: e6012312befac54e09ce69e5bf35536d
    domain: sensor
    trigger: device
    above: 81
    below: 84
    for:
      hours: 0
      minutes: 1
      seconds: 0
  - alias: Server room temp below 81
    type: temperature
    device_id: a738b1433310ce7349c22435a38d7c23
    entity_id: e6012312befac54e09ce69e5bf35536d
    domain: sensor
    trigger: device
    above: 50
    below: 81
    for:
      hours: 0
      minutes: 1
      seconds: 0
  conditions:
  - condition: state
    entity_id: input_boolean.rack_fan_manual_mode
    state:
    - 'off'
  - condition: not
    conditions:
    - condition: state
      entity_id: climate.hallway_thermostat
      state:
      - cooling
      attribute: hvac_action
    alias: If current hvac action is not cooling
  actions:
  - choose:
    - conditions:
      - type: is_temperature
        condition: device
        device_id: a738b1433310ce7349c22435a38d7c23
        entity_id: e6012312befac54e09ce69e5bf35536d
        domain: sensor
        above: 87
        alias: temp > 87
      sequence:
      - action: fan.set_percentage
        metadata: {}
        target:
          entity_id: fan.rack_fans_rack_fan_1
        data:
          percentage: 65
      - action: fan.set_percentage
        metadata: {}
        target:
          entity_id: fan.rack_fans_rack_fan_2
        data:
          percentage: 68
    - conditions:
      - alias: temp > 84 and temp < 87
        type: is_temperature
        condition: device
        device_id: a738b1433310ce7349c22435a38d7c23
        entity_id: e6012312befac54e09ce69e5bf35536d
        domain: sensor
        above: 84
        below: 87.1
      sequence:
      - action: fan.set_percentage
        metadata: {}
        target:
          entity_id: fan.rack_fans_rack_fan_1
        data:
          percentage: 45
      - action: fan.set_percentage
        metadata: {}
        target:
          entity_id: fan.rack_fans_rack_fan_2
        data:
          percentage: 49
    - conditions:
      - alias: temp > 81 and temp < 84
        type: is_temperature
        condition: device
        device_id: a738b1433310ce7349c22435a38d7c23
        entity_id: e6012312befac54e09ce69e5bf35536d
        domain: sensor
        above: 81
        below: 84.1
      sequence:
      - action: fan.set_percentage
        metadata: {}
        target:
          entity_id: fan.rack_fans_rack_fan_1
        data:
          percentage: 35
      - action: fan.set_percentage
        metadata: {}
        target:
          entity_id: fan.rack_fans_rack_fan_2
        data:
          percentage: 39
    - conditions:
      - alias: temp < 81
        type: is_temperature
        condition: device
        device_id: a738b1433310ce7349c22435a38d7c23
        entity_id: e6012312befac54e09ce69e5bf35536d
        domain: sensor
        below: 81.1
      sequence:
      - action: fan.set_percentage
        metadata: {}
        target:
          entity_id: fan.rack_fans_rack_fan_1
        data:
          percentage: 20
      - action: fan.set_percentage
        metadata: {}
        target:
          entity_id: fan.rack_fans_rack_fan_2
        data:
          percentage: 22
  mode: single
- id: '1779747704844'
  alias: Rack fan speed to 90% when Google thermostat starts cooling
  description: Set the rack custom fan to 90% whenever the Google thermostat enters
    cooling mode.
  triggers:
  - entity_id:
    - climate.hallway_thermostat
    to:
    - cooling
    trigger: state
    attribute: hvac_action
  - entity_id:
    - climate.hallway_thermostat
    to:
    - idle
    - 'off'
    - fan
    trigger: state
    attribute: hvac_action
    enabled: true
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: climate.hallway_thermostat
        state:
        - cooling
        attribute: hvac_action
      sequence:
      - action: fan.set_percentage
        metadata: {}
        target:
          entity_id: fan.rack_fans_rack_fan_1
        data:
          percentage: 90
      - action: fan.set_percentage
        metadata: {}
        target:
          entity_id: fan.rack_fans_rack_fan_2
        data:
          percentage: 94
      alias: If cooling increase fan speed to 90 and 94 %
    - conditions:
      - condition: state
        entity_id: climate.hallway_thermostat
        state:
        - 'off'
        - idle
        - fan
        attribute: hvac_action
      - condition: not
        conditions:
        - condition: state
          entity_id: climate.hallway_thermostat
          state:
          - cooling
          attribute: hvac_action
      sequence:
      - action: automation.trigger
        metadata: {}
        target:
          entity_id: automation.rack_fan_speed_automation
        data:
          skip_condition: true
      alias: If idle or on fan mode go back to usual automation speed
  mode: single
- id: '1780249561717'
  alias: Garage Door Open Notification
  description: Notify that Garage door is open after 15 minutes
  triggers:
  - trigger: state
    entity_id:
    - number.ghar_garage_door_dooropenduration
    to:
    - 'on'
    for:
      hours: 0
      minutes: 15
      seconds: 0
  conditions: []
  actions:
  - variables:
      snapshot_time: '{{ now().strftime(''%Y%m%d_%H%M%S'') }}'
  - sequence:
    - action: camera.snapshot
      metadata: {}
      data:
        filename: /config/www/arlo_snapshots_videos/garage/garage_open__{{ snapshot_time
          }}.jpg
      target:
        entity_id: camera.garage_fluent
    - delay:
        hours: 0
