apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-settings
  namespace: searxng
data:
  settings.yml: |
    use_default_settings: true
    general:
      instance_name: "deep's homelab search"
      privacypolicy_url: false
      donation_url: false
      contact_url: false
      enable_metrics: false
    server:
      base_url: https://searxng.dkghar.duckdns.org/
      port: 8080
      bind_address: "0.0.0.0"
      secret_key: "WILL_BE_OVERRIDDEN_BY_SEARXNG_SECRET_ENV"
      limiter: false
      image_proxy: true
      method: "GET"
      default_http_headers:
        X-Content-Type-Options: nosniff
        X-Download-Options: noopen
        X-Robots-Tag: noindex, nofollow
        Referrer-Policy: no-referrer
    ui:
      static_use_hash: true
      default_theme: simple
      theme_args:
        simple_style: dark
    search:
      safe_search: 0
      autocomplete: ""
      default_lang: "en"
      formats:
        - html
        - json
    enabled_plugins:
      - 'Hash plugin'
      - 'Self Information'
      - 'Tracker URL remover'
      - 'Ahmia blacklist'
      - 'Hostnames plugin'
      - 'Open Access DOI rewrite'
    outgoing:
      request_timeout: 6.0
      max_request_timeout: 10.0
      pool_connections: 100
      pool_maxsize: 20
      enable_http2: true

    # Engine set, chosen from a per-engine probe on 2026-09-13 (build
    # 2026.9.13+230c3632d, two queries each via `&engines=<name>`).
    #
    # Reliability comes from DIVERSITY: SearXNG merges whatever answers, so any
    # one engine getting CAPTCHA'd or rate-limited just drops out instead of
    # zeroing results. The previous config ran the upstream defaults, which on a
    # stale image left only wikipedia/wikidata usable - 0 results for everything.
    #
    # Default-enabled engines not listed here (google, duckduckgo, brave,
    # startpage, wikipedia) stay enabled.
    engines:
      # --- off by default upstream; answered reliably in the probe ---
      - name: bing          # 10/10
        disabled: false
      - name: presearch     # 33/33
        disabled: false
        timeout: 8.0
      - name: dogpile       # 34/35 (metasearch front-end, good redundancy)
        disabled: false
      # --- failing every request; disabled so they stop eating timeout budget ---
      - name: qwant         # CAPTCHA
        disabled: true
      - name: mojeek        # HTTP errors
        disabled: true
      - name: yahoo         # parsing errors
        disabled: true
      - name: wikidata      # HTTP errors on every call (20/day in logs)
        disabled: true
