apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-logs-config
  namespace: monitoring
data:
  config.alloy: |
    // Discover all pods, tail their logs via the K8s API (no host mounts — Talos-friendly),
    // and ship to Loki on CT405 with namespace/pod/container/node/app labels.
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pods.targets
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }
      rule {
        source_labels = ["__meta_kubernetes_node_name"]
        target_label  = "node"
      }
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }
    }

    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.write.default.receiver]
    }

    // Kubernetes events (scheduling failures, BackOff, OOMKilling, probe failures, evictions).
    // They only live ~1h in the API, so ship them to Loki. logfmt lines; stream labels
    // job="kubernetes-events", namespace=<involved object ns>. Query with `| logfmt`.
    loki.source.kubernetes_events "events" {
      job_name   = "kubernetes-events"
      log_format = "logfmt"
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://192.168.4.66:3100/loki/api/v1/push"
      }
    }
