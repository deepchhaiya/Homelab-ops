apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: monitoring
data:
  scrape.yaml: |
    global:
      scrape_interval: 30s

    scrape_configs:
      # kubelet metrics via the apiserver proxy (Talos-friendly, no direct :10250 access)
      - job_name: kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: 192.168.4.172:6443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: 192.168.4.172:6443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      # pods annotated with prometheus.io/scrape: "true"
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod

      # kube-state-metrics: object state. honor_labels keeps KSM's own namespace/pod/node
      # labels (they describe the object, not the KSM pod). Not the annotation job above,
      # which would rename them to exported_namespace/exported_pod.
      - job_name: kube-state-metrics
        honor_labels: true
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc:8080"]

      # node-exporter DaemonSet on the Talos nodes (hostNetwork :9100). Running pods only,
      # so DaemonSet pods stuck Pending on sleeping WOL nodes don't become down targets.
      # instance = node name, matching the kubelet/cadvisor jobs.
      - job_name: kubernetes-node-exporter
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [node-exporter]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_phase]
            regex: node-exporter;Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # CoreDNS (kube-dns pods expose :9153)
      - job_name: coredns
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [kube-system]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_k8s_app, __meta_kubernetes_pod_phase]
            regex: kube-dns;Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9153"
            action: keep
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node

      # kube-apiserver. Its /metrics is huge (histogram buckets per resource x verb), so
      # keep only what the Kubernetes Cluster dashboard uses.
      - job_name: apiserver
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        static_configs:
          - targets: ["192.168.4.172:6443"]
            labels: { node: "ira-peladn-talos-cp" }
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: >-
              apiserver_request_total|apiserver_request_duration_seconds_(sum|count)|apiserver_current_inflight_requests|apiserver_(storage|resource)_objects|etcd_request_duration_seconds_(sum|count)|apiserver_storage_size_bytes|process_resident_memory_bytes|process_cpu_seconds_total|go_goroutines
            action: keep

      # Alloy pod-log shipper's own health (dropped entries, write errors)
      - job_name: alloy-logs
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [monitoring]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_phase]
            regex: alloy-logs;Running
            action: keep
          - source_labels: [__address__]
            regex: ([^:]+)(?::\d+)?
            replacement: $1:12345
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
