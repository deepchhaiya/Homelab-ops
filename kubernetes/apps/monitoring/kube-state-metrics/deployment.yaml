# kube-state-metrics: object state (pod phase, restarts, requests/limits, deployment
# replicas, node conditions, PVCs, Flux CRs). Scraped by vmagent's `kube-state-metrics`
# job with honor_labels (NOT the pod-annotation job, which would clobber namespace/pod).
# v2.19.x is the release line built against client-go v1.35 (cluster is v1.35.2).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      nodeSelector:
        kubernetes.io/hostname: ira-rpi4-talos-worker   # always-on worker, next to vmagent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1   # multi-arch
          args:
            - --port=8080
            - --telemetry-port=8081
            # no secrets/configmaps: see rbac.yaml
            - --resources=cronjobs,daemonsets,deployments,horizontalpodautoscalers,ingresses,jobs,namespaces,nodes,persistentvolumeclaims,persistentvolumes,poddisruptionbudgets,pods,replicasets,resourcequotas,services,statefulsets,storageclasses
            - --metric-labels-allowlist=pods=[app],nodes=[tier]
            - --custom-resource-state-config-file=/etc/ksm/flux.yaml
          ports:
            - { name: http-metrics, containerPort: 8080 }
            - { name: telemetry,    containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            initialDelaySeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /livez, port: 8080 }
            initialDelaySeconds: 5
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: crs
              mountPath: /etc/ksm
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
      volumes:
        - name: crs
          configMap:
            name: kube-state-metrics-crs
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  selector:
    app: kube-state-metrics
  ports:
    - { name: http-metrics, port: 8080, targetPort: http-metrics }
    - { name: telemetry,    port: 8081, targetPort: telemetry }
