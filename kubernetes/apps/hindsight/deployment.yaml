# Hindsight — self-hosted agent memory (native MCP + web UI). Replaces mem0.
# All-in-one image: API+MCP (8888) + control-plane UI (9999) + embedded postgres.
# LLM (retain/graph extraction) offloaded to the .84 Ollama (qwen3.6:35b-a3b);
# embeddings (bge-small 384-d) + reranker (ms-marco-MiniLM) run locally in-pod.
# Pinned to the evo-x2 ai-worker (amd64, co-located with .84 Ollama).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: hindsight
  labels: { app: hindsight }
spec:
  replicas: 1
  strategy: { type: Recreate }   # single RWO PVC (embedded postgres)
  selector:
    matchLabels: { app: hindsight }
  template:
    metadata:
      labels: { app: hindsight }
    spec:
      nodeSelector:
        tier: ai-worker
      # Embedded postgres needs the data dir owned by the image's 'hindsight'
      # user; local-path mounts it root-owned. Chown via the same image (which
      # has the user in /etc/passwd) as root before the app starts.
      initContainers:
        - name: fix-perms
          image: ghcr.io/vectorize-io/hindsight:0.10.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "chown -R hindsight:hindsight /home/hindsight/.pg0"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - { name: data, mountPath: /home/hindsight/.pg0 }
      containers:
        - name: hindsight
          image: ghcr.io/vectorize-io/hindsight:0.10.1
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8888, name: api }
            - { containerPort: 9999, name: ui }
          env:
            # --- LLM: retain-time fact extraction via .84 Ollama ---
            # qwen3:4b-instruct (non-thinking) chosen over qwen3.6:35b-a3b: the 35b
            # is a thinking model (~35s/call, and its output broke Hindsight's JSON
            # extraction). 4b-instruct returns clean JSON in all modes at ~1s, so
            # retain/import stay fast; Hindsight's 4-strategy retrieval + reranker
            # (all local) carry the recall quality.
            - { name: HINDSIGHT_API_LLM_PROVIDER,    value: "ollama" }
            - { name: HINDSIGHT_API_LLM_MODEL,       value: "qwen3:4b-instruct" }
            - { name: HINDSIGHT_API_LLM_BASE_URL,    value: "http://192.168.4.84:11434" }
            - { name: HINDSIGHT_API_LLM_API_KEY,     value: "ollama-unused" }
            - { name: HINDSIGHT_API_LLM_STRICT_SCHEMA, value: "true" }
            - { name: HINDSIGHT_API_LLM_TEMPERATURE, value: "0.1" }
            # HINDSIGHT_API_LLM_OLLAMA_NUM_CTX deliberately unset (was 65536 until
            # 2026-09-29). It is global: Hindsight sent it to both models on the native
            # path, while reflect's /v1 tool calls always get the server default, so it
            # had to equal OLLAMA_CONTEXT_LENGTH or the 35B reloaded between rounds. Unset,
            # every call gets the model's own default, which is consistent per model:
            # qwen3.6 = server default 262,144; qwen3:4b-instruct = 32,768 pinned in its
            # Modelfile (largest retain/consolidation prompt seen: 17.7k tokens). At 65,536
            # the 4B loaded at 24.2 GB. See infrastructure/ollama-host/README.md.
            # --- LLM: reflect + mental-model refresh (refresh falls back to these) ---
            # Reflect is a tool-calling agent loop; qwen3:4b-instruct emits garbled
            # tool calls (ReflectToolCallError), so every reflect/mental model failed.
            # qwen3.6:35b-a3b makes clean tool calls and is already resident for the
            # curator brief. reasoning_effort "none" = Ollama think:false over /v1
            # (0 reasoning tokens, ~12s/call when the host is idle).
            - { name: HINDSIGHT_API_REFLECT_LLM_PROVIDER,         value: "ollama" }
            - { name: HINDSIGHT_API_REFLECT_LLM_MODEL,            value: "qwen3.6:35b-a3b" }
            - { name: HINDSIGHT_API_REFLECT_LLM_BASE_URL,         value: "http://192.168.4.84:11434" }
            - { name: HINDSIGHT_API_REFLECT_LLM_API_KEY,          value: "ollama-unused" }
            - { name: HINDSIGHT_API_REFLECT_LLM_REASONING_EFFORT, value: "none" }
            - { name: HINDSIGHT_API_REFLECT_LLM_MAX_CONCURRENT,   value: "1" }
            # Per call. A split-synthesis map call on a ~47k-token chunk: ~65s prefill +
            # up to 16384 tokens at ~55 tok/s (~300s) = ~365s.
            - { name: HINDSIGHT_API_REFLECT_LLM_TIMEOUT,          value: "600" }
            # Whole-reflect wall clock (default 300s). Worst case measured 2026-09-29:
            # tool rounds ~180s + 2 serial map calls ~730s + reduce ~100s = ~1010s.
            # Mental-model cron slots are 35 min apart (06:00-08:55 UTC) to fit this.
            - { name: HINDSIGHT_API_REFLECT_WALL_TIMEOUT,         value: "1800" }
            # Sized for the old 65,536-token window; kept after the window went to 262,144
            # (2026-09-29) because qwen3.6 re-prefills every round, so a bigger budget
            # slows every reflect. It now only bounds speed, not truncation. The default
            # (100000) makes split-synthesis map chunks of 0.8x = 80k tokens, so a map
            # prompt filled the window and generation hit its end (done_reason "length" ->
            # OutputTooLongError). Rule from a similar Talos/Flux deployment
            # (bluevulpine/flux-talos#1912): budget x1.1 tokenizer slack + ~8k output must
            # fit the window: 48000*1.1 + 8192 = ~61k < 65,536. Smaller prompts also cut
            # the full re-prefill qwen3.6 (hybrid) pays every round (hindsight#3865).
            - { name: HINDSIGHT_API_REFLECT_MAX_CONTEXT_TOKENS,   value: "48000" }
            # Explicit output cap (default: none). Kept at 8192: split-synthesis map calls
            # grow with their input (every claim + provenance), so broad questions ran to
            # 8192 and then 16384 alike (2026-09-29). Fix was design-level: only narrow
            # mental models that never split; this cap just bounds a runaway to ~2.5 min.
            - { name: HINDSIGHT_API_REFLECT_MAX_COMPLETION_TOKENS, value: "8192" }
            # Default is 4 attempts x 300s: one slow call could hold the single reflect
            # slot ~20 min. Hindsight's local-LLM guidance: retries rarely help a slow
            # box; the worker still retries the whole task on failure.
            - { name: HINDSIGHT_API_REFLECT_LLM_MAX_RETRIES,      value: "2" }
            # Sampling for reflect's native (non-tool) calls: split-synthesis map calls,
            # reduce and final synthesis. Hindsight hard-codes map temperature 0.0; on
            # qwen3.6 that greedy decoding cycled the claim list (2026-09-29: 32 distinct
            # claims then repeats, 58% unique lines, runs to OutputTooLongError). These
            # options are merged over Hindsight's own on the native path; the /v1 tool-call
            # rounds ignore them. Qwen3 non-thinking recommendation: 0.7 / 0.8 / 20.
            # Penalties deliberately untouched (Modelfile presence_penalty 1.5 still applies).
            - name: HINDSIGHT_API_REFLECT_LLM_EXTRA_BODY
              value: '{"options":{"temperature":0.7,"top_p":0.8,"top_k":20}}'
            # --- Recall speed. Reranking runs on this pod's CPU (cross-encoder); the
            # default 300 candidates per recall took ~110s on 3 cores inside reflect.
            # Reflect only uses the top ~10-20 results, so 100 keeps quality.
            - { name: HINDSIGHT_API_RERANKER_MAX_CANDIDATES,      value: "100" }
            # Stable worker id (Deployment pod name changes on recreate -> else
            # in-flight consolidation tasks can get orphaned). Single replica.
            - { name: HINDSIGHT_API_WORKER_ID, value: "hindsight-0" }
            # --- API-key auth (built-in tenant extension). Once set, every API/MCP
            #     request must send `Authorization: Bearer <HINDSIGHT_API_TENANT_API_KEY>`
            #     (401 without). Also populates the per-bank audit log (ops attributed
            #     to the authenticated tenant). Banks deep/family keep their paths. ---
            - { name: HINDSIGHT_API_TENANT_EXTENSION, value: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension" }
            - name: HINDSIGHT_API_TENANT_API_KEY
              valueFrom: { secretKeyRef: { name: hindsight-auth, key: HINDSIGHT_API_TENANT_API_KEY } }
            # Built-in CP UI must present the same key to the now-locked dataplane API
            - name: HINDSIGHT_CP_DATAPLANE_API_KEY
              valueFrom: { secretKeyRef: { name: hindsight-auth, key: HINDSIGHT_CP_DATAPLANE_API_KEY } }
            # Shared secret to view the Control Plane web UI (:30999)
            - name: HINDSIGHT_CP_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: hindsight-auth, key: HINDSIGHT_CP_ACCESS_KEY } }
            # --- embeddings + reranker stay local (defaults); cache on the PVC ---
            - { name: HF_HOME, value: "/home/hindsight/.pg0/hf" }
            - { name: HINDSIGHT_API_LOG_LEVEL, value: "info" }
            - { name: HINDSIGHT_API_AUDIT_LOG_ENABLED, value: "true" }
            # SSRF guard blocks webhook delivery to private IPs by default;
            # NPM and every other homelab service live on the 192.168.4.0/24
            # LAN, so webhooks to those hosts need an explicit allowlist entry.
            - { name: HINDSIGHT_API_WEBHOOK_ALLOWED_HOSTS, value: "192.168.4.0/24" }
          volumeMounts:
            - { name: data, mountPath: /home/hindsight/.pg0 }
          startupProbe:
            # First boot downloads ~215MB of models + runs DB migrations — be generous.
            tcpSocket: { port: 8888 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: 8888 }
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            tcpSocket: { port: 8888 }
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            # CPU-bound: embeddings + reranker run in-pod. Above the VM's current 4 vCPUs
            # on purpose, so raising VM 402's cores takes effect with no manifest change.
            limits:   { cpu: "6000m", memory: "3Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hindsight-data
