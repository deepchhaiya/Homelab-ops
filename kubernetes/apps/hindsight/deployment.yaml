# Hindsight — self-hosted agent memory (native MCP + web UI). Replaces mem0.
# All-in-one image: API+MCP (8888) + control-plane UI (9999) + embedded postgres.
# LLM (retain/graph extraction) offloaded to the .84 Ollama (qwen3.6:35b-a3b);
# embeddings (bge-small 384-d) + reranker (ms-marco-MiniLM) run locally in-pod.
# Pinned to the evo-x2 ai-worker (amd64, co-located with .84 Ollama).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hindsight
  namespace: hindsight
  labels: { app: hindsight }
spec:
  replicas: 1
  strategy: { type: Recreate }   # single RWO PVC (embedded postgres)
  selector:
    matchLabels: { app: hindsight }
  template:
    metadata:
      labels: { app: hindsight }
    spec:
      nodeSelector:
        tier: ai-worker
      # Embedded postgres needs the data dir owned by the image's 'hindsight'
      # user; local-path mounts it root-owned. Chown via the same image (which
      # has the user in /etc/passwd) as root before the app starts.
      initContainers:
        - name: fix-perms
          image: ghcr.io/vectorize-io/hindsight:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "chown -R hindsight:hindsight /home/hindsight/.pg0"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - { name: data, mountPath: /home/hindsight/.pg0 }
      containers:
        - name: hindsight
          image: ghcr.io/vectorize-io/hindsight:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8888, name: api }
            - { containerPort: 9999, name: ui }
          env:
            # --- LLM: retain-time fact extraction via .84 Ollama ---
            # qwen3:4b-instruct (non-thinking) chosen over qwen3.6:35b-a3b: the 35b
            # is a thinking model (~35s/call, and its output broke Hindsight's JSON
            # extraction). 4b-instruct returns clean JSON in all modes at ~1s, so
            # retain/import stay fast; Hindsight's 4-strategy retrieval + reranker
            # (all local) carry the recall quality.
            - { name: HINDSIGHT_API_LLM_PROVIDER,    value: "ollama" }
            - { name: HINDSIGHT_API_LLM_MODEL,       value: "qwen3:4b-instruct" }
            - { name: HINDSIGHT_API_LLM_BASE_URL,    value: "http://192.168.4.84:11434" }
            - { name: HINDSIGHT_API_LLM_API_KEY,     value: "ollama-unused" }
            - { name: HINDSIGHT_API_LLM_STRICT_SCHEMA, value: "true" }
            - { name: HINDSIGHT_API_LLM_TEMPERATURE, value: "0.1" }
            - { name: HINDSIGHT_API_LLM_OLLAMA_NUM_CTX, value: "16384" }
            # Stable worker id (Deployment pod name changes on recreate -> else
            # in-flight consolidation tasks can get orphaned). Single replica.
            - { name: HINDSIGHT_API_WORKER_ID, value: "hindsight-0" }
            # --- API-key auth (built-in tenant extension). Once set, every API/MCP
            #     request must send `Authorization: Bearer <HINDSIGHT_API_TENANT_API_KEY>`
            #     (401 without). Also populates the per-bank audit log (ops attributed
            #     to the authenticated tenant). Banks deep/family keep their paths. ---
            - { name: HINDSIGHT_API_TENANT_EXTENSION, value: "hindsight_api.extensions.builtin.tenant:ApiKeyTenantExtension" }
            - name: HINDSIGHT_API_TENANT_API_KEY
              valueFrom: { secretKeyRef: { name: hindsight-auth, key: HINDSIGHT_API_TENANT_API_KEY } }
            # Built-in CP UI must present the same key to the now-locked dataplane API
            - name: HINDSIGHT_CP_DATAPLANE_API_KEY
              valueFrom: { secretKeyRef: { name: hindsight-auth, key: HINDSIGHT_CP_DATAPLANE_API_KEY } }
            # Shared secret to view the Control Plane web UI (:30999)
            - name: HINDSIGHT_CP_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: hindsight-auth, key: HINDSIGHT_CP_ACCESS_KEY } }
            # --- embeddings + reranker stay local (defaults); cache on the PVC ---
            - { name: HF_HOME, value: "/home/hindsight/.pg0/hf" }
            - { name: HINDSIGHT_API_LOG_LEVEL, value: "info" }
            - { name: HINDSIGHT_API_AUDIT_LOG_ENABLED, value: "true" }
          volumeMounts:
            - { name: data, mountPath: /home/hindsight/.pg0 }
          startupProbe:
            # First boot downloads ~215MB of models + runs DB migrations — be generous.
            tcpSocket: { port: 8888 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: 8888 }
            periodSeconds: 15
            failureThreshold: 4
          livenessProbe:
            tcpSocket: { port: 8888 }
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits:   { cpu: "3000m", memory: "3Gi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hindsight-data
